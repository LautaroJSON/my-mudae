<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyMudae</title>
    <!--
      Tipografía de DESIGN.md / shared/theme.ts (Outfit + JetBrains Mono).
      Si no hay red disponible, el stack de fallback (system-ui, etc.)
      definido en theme.ts se usa igual: la app sigue siendo funcional
      offline (Restricciones Técnicas de la constitución).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Anti-parpadeo de tema (007): fija data-theme antes del primer
      render de React si el usuario ya había elegido "claro"/"legacy"
      (localStorage, mismo mecanismo que useThemePreference.ts). El tema
      "default" no necesita esto -- ya decide su apariencia vía
      prefers-color-scheme, sin parpadeo posible. Envuelto en try/catch:
      localStorage puede lanzar en contextos restringidos (navegación
      privada estricta).
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('mymudae:theme')
          if (theme === 'claro' || theme === 'legacy') {
            document.documentElement.setAttribute('data-theme', theme)
          }
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
